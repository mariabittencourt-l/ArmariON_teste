<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArmariON - Detalhes da Peça</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FDFBFD] text-[#1A1118] flex justify-center items-center min-h-screen p-4 m-0">

    <!-- Container do Smartphone com altura controlada e scroll interno -->
    <div class="w-full max-w-[390px] h-[85vh] max-h-[820px] bg-[#FDFBFD] rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border border-[#EFECEF]">
        
        <!-- Header Superior Fixo -->
        <div class="px-6 pt-4 pb-2 flex items-center justify-between bg-[#FDFBFD] z-10 shrink-0 border-b border-[#F7F5F7]">
            <a href="pecas.html" class="text-[#1A1118] p-1 hover:text-[#5B0E8D] transition-colors">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </a>
            <span class="font-semibold text-sm tracking-wide text-[#4A2E4B]">ArmariON</span>
            <button class="text-[#1A1118] p-1">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
            </button>
        </div>

        <!-- Conteúdo com Scroll Interno -->
        <div class="flex-1 overflow-y-auto px-6 pt-2 pb-24">
            
            <!-- Título da Seção -->
            <div class="mt-4 mb-4">
                <span class="text-[11px] uppercase tracking-wider text-gray-500 font-medium">
                    SEU ACERVO · ZARA
                </span>
                <h1 class="text-3xl font-serif font-normal text-[#1A1118] mt-1 leading-tight">
                    Blazer de linho
                </h1>
            </div>

            <!-- Imagem da Peça com Destaque -->
            <div class="mb-2">
                <div class="bg-[#F4F1F4] rounded-2xl overflow-hidden aspect-[4/3] relative border border-[#EFECEF]">
                    <img src="https://images.unsplash.com/photo-1507679799987-c73779587ccf?auto=format&fit=crop&q=80&w=600" alt="Blazer de linho" class="w-full h-full object-cover">
                </div>
                <div class="flex justify-between items-center mt-2 text-xs">
                    <button class="text-[#5B0E8D] font-medium hover:underline">Alterar foto</button>
                    <span class="text-gray-500 flex items-center gap-1">
                        Fundo removido 
                        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" class="text-[#5B0E8D]"><polyline points="20 6 9 17 4 12"/></svg>
                    </span>
                </div>
            </div>

            <!-- Nome -->
            <div class="mb-4 mt-3">
                <label class="block text-xs text-gray-600 mb-1.5">Nome</label>
                <div class="relative">
                    <input type="text" value="Blazer de linho" class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-[#4A2E4B]">
                    <svg class="absolute right-4 top-3.5 text-[#5B0E8D]" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                </div>
            </div>

            <!-- Categoria e Subcategoria -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5">Categoria</label>
                    <div class="relative">
                        <select class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 appearance-none focus:outline-none focus:border-[#4A2E4B]">
                            <option>Superior</option>
                            <option>Inferior</option>
                        </select>
                        <svg class="absolute right-4 top-3.5 text-[#5B0E8D] pointer-events-none" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5">Subcategoria</label>
                    <div class="relative">
                        <select class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 appearance-none focus:outline-none focus:border-[#4A2E4B]">
                            <option>Casacos</option>
                            <option>Camisas</option>
                        </select>
                        <svg class="absolute right-4 top-3.5 text-[#5B0E8D] pointer-events-none" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
            </div>

            <!-- Cores principais -->
            <div class="mb-4">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs text-gray-600">Cores principais</label>
                    <button class="text-xs text-[#5B0E8D] font-medium hover:underline">Editar paleta</button>
                </div>
                <div class="flex gap-4 items-center bg-white border border-[#EFECEF] rounded-xl p-3">
                    <div class="flex items-center gap-2">
                        <div class="w-5 h-5 rounded-full bg-[#D8C3A5] border border-gray-300"></div>
                        <span class="text-xs text-gray-700">Bege</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <div class="w-5 h-5 rounded-full bg-[#F3EFEA] border border-gray-300"></div>
                        <span class="text-xs text-gray-700">Cru</span>
                    </div>
                </div>
            </div>

            <!-- Marca -->
            <div class="mb-4">
                <label class="block text-xs text-gray-600 mb-1.5">Marca</label>
                <div class="relative">
                    <input type="text" value="Zara" class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-[#4A2E4B]">
                    <svg class="absolute right-4 top-3.5 text-[#5B0E8D]" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                </div>
            </div>

            <!-- Tamanho e Tecido -->
            <div class="grid grid-cols-2 gap-3 mb-4">
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5">Tamanho</label>
                    <div class="relative">
                        <select class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 appearance-none focus:outline-none focus:border-[#4A2E4B]">
                            <option>M</option>
                            <option>P</option>
                            <option>G</option>
                        </select>
                        <svg class="absolute right-4 top-3.5 text-[#5B0E8D] pointer-events-none" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-600 mb-1.5">Tecido</label>
                    <div class="relative">
                        <input type="text" value="Linho" class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-[#4A2E4B]">
                        <svg class="absolute right-4 top-3.5 text-[#5B0E8D]" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>
                    </div>
                </div>
            </div>

            <!-- Estações -->
            <div class="mb-4">
                <label class="block text-xs text-gray-600 mb-2">Estações</label>
                <div class="flex gap-2 flex-wrap">
                    <button class="px-4 py-2 rounded-full text-xs border border-[#E3DCE3] text-gray-700 bg-white">Verão</button>
                    <button class="px-4 py-2 rounded-full text-xs bg-[#5B0E8D] text-white font-medium shadow-sm">Outono</button>
                    <button class="px-4 py-2 rounded-full text-xs border border-[#E3DCE3] text-gray-700 bg-white">Inverno</button>
                    <button class="px-4 py-2 rounded-full text-xs bg-[#5B0E8D] text-white font-medium shadow-sm">Primavera</button>
                </div>
            </div>

            <!-- Localização no armário -->
            <div class="mb-4">
                <label class="block text-xs text-gray-600 mb-1.5">Localização no armário</label>
                <div class="relative">
                    <input type="text" value="Módulo A · Cabide C03" class="w-full bg-white border border-[#E3DCE3] rounded-xl px-4 py-3 text-sm text-gray-800 focus:outline-none focus:border-[#4A2E4B]">
                    <svg class="absolute right-4 top-3.5 text-[#5B0E8D]" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
                </div>
                <a href="localizar.html" class="text-xs text-[#5B0E8D] font-medium mt-1.5 inline-flex items-center gap-1 hover:underline">
                    Ver no armário e acender LED ↗
                </a>
            </div>

            <!-- Botão Salvar alterações -->
            <a href="pecas.html" class="w-full bg-[#D44000] hover:bg-[#B83700] text-white font-medium py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 shadow-md transition-all mb-6">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                <span class="text-sm">Salvar alterações</span>
            </a>

            <!-- Card de Exclusão -->
            <div class="bg-[#FDF2F0] border border-[#FADCD8] rounded-2xl p-4 mb-4">
                <div class="flex items-center gap-2 text-[#C53030] font-semibold text-xs mb-1">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Excluir esta peça?
                </div>
                <p class="text-[11px] text-[#718096] mb-4 leading-relaxed">
                    O blazer será excluído do acervo e removido dos 3 looks associados. Os conjuntos serão mantidos sem esta peça. Esta ação não pode ser desfeita.
                </p>
                <div class="grid grid-cols-2 gap-3">
                    <button class="bg-[#EFECEF] hover:bg-[#E3DCE3] text-[#5B0E8D] font-medium py-2.5 px-3 rounded-xl text-xs text-center transition-all">
                        Cancelar
                    </button>
                    <button class="bg-transparent hover:bg-red-50 text-[#C53030] border border-[#FADCD8] font-medium py-2.5 px-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-all">
                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        Excluir
                    </button>
                </div>
            </div>

        </div>

        <!-- Barra de Navegação Inferior Fixa -->
        <div class="absolute bottom-0 left-0 right-0 bg-white border-t border-[#EFECEF] px-4 py-2.5 flex justify-around items-center text-gray-400 z-10">
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <span class="text-[10px]">Início</span>
            </button>
            <a href="pecas.html" class="flex flex-col items-center gap-1 text-[#5B0E8D]">
                <span class="text-[10px] font-medium">Peças</span>
                <span class="w-1 h-1 bg-[#5B0E8D] rounded-full"></span>
            </a>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <span class="text-[10px]">Looks</span>
            </button>
            <a href="armario.html" class="flex flex-col items-center gap-1 text-gray-400">
                <span class="text-[10px]">Armário</span>
            </a>
            <button class="flex flex-col items-center gap-1 text-gray-400">
                <span class="text-[10px]">Perfil</span>
            </button>
        </div>

    </div>
</body>
</html>
